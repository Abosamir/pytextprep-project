[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytextprep"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["pytextprep*"]

[tool.setuptools.package-data]
pytextprep = ["resources/*.txt", "resources/*.tsv"]